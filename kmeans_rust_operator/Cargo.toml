[package]
name = "kmeans_rust_operator"
version = "0.1.0"
edition = "2024"
description = "K-means clustering for Tercen — Rust port of tercen/kmeans_operator (stats::kmeans, Hartigan–Wong)"
license = "AGPL-3.0"

[[bin]]
name = "kmeans_rust_operator"
path = "src/main.rs"

[[bin]]
name = "dev"
path = "src/bin/dev.rs"

[dependencies]
anyhow = "1"

# --- Tercen plumbing (same stack as clusterx_rust_operator) ---
tercen-rs = { git = "https://github.com/tercen/tercen-rs", branch = "main" }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time"] }
tonic = "0.14"
futures = "0.3"
rustson = { git = "https://github.com/tercen/rustson", branch = "master" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Allocator: honours the task runner's MALLOC_CONF and returns freed memory to the OS
# (create-rust-operator §5).
tikv-jemallocator = "0.6"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
